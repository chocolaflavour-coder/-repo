<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- مكتبة قراءة الباركود -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
      direction: rtl;
      overflow: hidden;
      height: 100%;
    }

    #container {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
      padding: 5px;
      box-sizing: border-box;
    }

    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    #status {
      text-align: center;
      padding: 12px 4px;
      font-size: 15px;
      font-weight: bold;
      color: #ddd;
    }
  </style>
</head>

<body>
  <div id="container">
    <div id="reader"></div>
    <div id="status">⏳ جاري تشغيل الكاميرا...</div>
  </div>

  <script>
    // بروتوكول Streamlit الرسمي
    function sendMessageToStreamlitClient(type, data) {
      var outData = Object.assign({ isStreamlitMessage: true, type: type }, data);
      window.parent.postMessage(outData, "*");
    }

    function notifyReady() {
      sendMessageToStreamlitClient("streamlit:componentReady", { apiVersion: 1 });
    }

    function setFixedFrameHeight() {
      sendMessageToStreamlitClient("streamlit:setFrameHeight", { height: 480 });
    }

    function sendValueToStreamlit(value) {
      // إجبار القيمة أن تكون نص فقط
      sendMessageToStreamlitClient("streamlit:setComponentValue", {
        value: String(value || ""),
        dataType: "json",
      });
    }

    var statusDiv = document.getElementById("status");
    var scanning = true;

    var html5Qrcode = new Html5Qrcode("reader", { verbose: false });

    function onScanSuccess(decodedText, decodedResult) {
      if (!scanning) return;
      scanning = false;

      // إجبار القيمة أن تكون نص فقط مهما كان نوعها
      const pureText = String(decodedText || decodedResult?.text || "");

      statusDiv.innerText = "✅ تم قراءة الباركود";

      html5Qrcode.stop()
        .then(() => sendValueToStreamlit(pureText))
        .catch(() => sendValueToStreamlit(pureText));
    }

    function onScanFailure() {
      // تجاهل الأخطاء أثناء الفحص
    }

    var config = {
      fps: 10,
      qrbox: { width: 250, height: 250 }
    };

    html5Qrcode
      .start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
      .then(() => {
        statusDiv.innerText = "📡 وجّه الكاميرا نحو الباركود...";
        setFixedFrameHeight();
      })
      .catch(err => {
        statusDiv.innerText = "⚠️ تعذّر تشغيل الكاميرا: " + err;
        setFixedFrameHeight();
      });

    window.addEventListener("load", () => {
      notifyReady();
      setFixedFrameHeight();
    });

    notifyReady();
  </script>
</body>
</html>
