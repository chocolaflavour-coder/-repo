<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
        direction: rtl;
        overflow: hidden;
        height: 100%;
      }
      #container {
        width: 100%;
        max-width: 450px;
        margin: 0 auto;
        padding: 5px;
        box-sizing: border-box;
      }
      #reader {
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        background: #000; /* خلفية سوداء تظهر فورًا لمنع الوميض الأبيض */
      }
      #status {
        text-align: center;
        padding: 12px 4px;
        font-size: 15px;
        font-weight: bold;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="reader"></div>
      <div id="status">⏳ جاري تشغيل الكاميرا...</div>
    </div>

    <script>
      // -------------------- بروتوكول Streamlit الرسمي --------------------
      function sendMessageToStreamlitClient(type, data) {
        var outData = Object.assign({ isStreamlitMessage: true, type: type }, data);
        window.parent.postMessage(outData, "*");
      }

      function notifyReady() {
        sendMessageToStreamlitClient("streamlit:componentReady", { apiVersion: 1 });
      }

      function setFixedFrameHeight() {
        // تحديد ارتفاع ثابت وكافي لمنع التقطيع والوميض تمامًا في Streamlit
        sendMessageToStreamlitClient("streamlit:setFrameHeight", { height: 480 });
      }

      function sendValueToStreamlit(value) {
        sendMessageToStreamlitClient("streamlit:setComponentValue", {
          value: value,
          dataType: "json",
        });
      }

      var statusDiv = document.getElementById("status");
      var scanning = true;

      var html5Qrcode = new Html5Qrcode("reader", { verbose: false });

      function onScanSuccess(decodedText) {
        if (!scanning) return;
        scanning = false;
        statusDiv.innerText = "✅ تم قراءة الباركود";
        html5Qrcode.stop().then(function () {
          sendValueToStreamlit(decodedText);
        }).catch(function () {
          sendValueToStreamlit(decodedText);
        });
      }

      function onScanFailure() {
        // تجاهل طبيعي أثناء الفحص وظهور الكود
      }

      // إعدادات مرنة جداً لمنع الوميض والتعارض مع تعريفات كاميرا الهاتف
      var config = {
        fps: 10,
        qrbox: { width: 250, height: 250 } // صندوق فحص مربع وواضح وثابت
      };

      // تشغيل الكاميرا الخلفية
      html5Qrcode
        .start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
        .then(function () {
          statusDiv.innerText = "📡 وجّه الكاميرا نحو الباركود...";
          setFixedFrameHeight(); // ضبط المساحة فوراً بعد استقرار الكاميرا
        })
        .catch(function (err) {
          statusDiv.innerText = "⚠️ تعذّر تشغيل الكاميرا: " + err;
          setFixedFrameHeight();
        });

      window.addEventListener("load", function () {
        notifyReady();
        setFixedFrameHeight();
      });
      notifyReady();
    </script>
  </body>
</html>
