<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
        direction: rtl;
        overflow: hidden;
      }
      #reader {
        width: 100%;
        max-width: 500px; /* يمنع تمدد الكاميرا بشكل مفرط على الشاشات الكبيرة */
        margin: 0 auto;
        border-radius: 12px;
        overflow: hidden;
        background: #f0f0f0;
      }
      /* تحسين أبعاد الفيديو داخل القارئ */
      #reader video {
        width: 100% !important;
        height: auto !important;
        object-fit: cover;
      }
      #status {
        text-align: center;
        padding: 12px 4px;
        font-size: 15px;
        font-weight: bold;
        color: #444;
      }
    </style>
  </head>
  <body>
    <div id="reader"></div>
    <div id="status">⏳ جاري تشغيل الكاميرا...</div>

    <script>
      // -------------------- بروتوكول Streamlit الرسمي --------------------
      function sendMessageToStreamlitClient(type, data) {
        var outData = Object.assign({ isStreamlitMessage: true, type: type }, data);
        window.parent.postMessage(outData, "*");
      }

      function notifyReady() {
        sendMessageToStreamlitClient("streamlit:componentReady", { apiVersion: 1 });
      }

      function setFrameHeight() {
        // حساب الارتفاع الفعلي للصفحة بالكامل ليتناسب مع حجم الكاميرا
        var h = document.documentElement.scrollHeight || 450;
        sendMessageToStreamlitClient("streamlit:setFrameHeight", { height: h });
      }

      function sendValueToStreamlit(value) {
        sendMessageToStreamlitClient("streamlit:setComponentValue", {
          value: value,
          dataType: "json",
        });
      }

      var statusDiv = document.getElementById("status");
      var scanning = true;

      var formatsToSupport = [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.AZTEC,
        Html5QrcodeSupportedFormats.DATA_MATRIX,
        Html5QrcodeSupportedFormats.PDF_417,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_93,
        Html5QrcodeSupportedFormats.CODABAR,
        Html5QrcodeSupportedFormats.ITF,
      ];

      var html5Qrcode = new Html5Qrcode("reader", {
        formatsToSupport: formatsToSupport,
        verbose: false,
      });

      function onScanSuccess(decodedText) {
        if (!scanning) return;
        scanning = false;
        statusDiv.innerText = "✅ تم قراءة الباركود";
        html5Qrcode
          .stop()
          .then(function () {
            sendValueToStreamlit(decodedText);
          })
          .catch(function () {
            sendValueToStreamlit(decodedText);
          });
      }

      function onScanFailure() {
        // تجاهل الأخطاء المستمرة أثناء البحث عن كود
      }

      // إعدادات الكاميرا محسنة الحجم والأبعاد
      var config = {
        fps: 15, // زيادة عدد الإطارات لجعل الفحص أسرع وأسلس
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          // جعل صندوق الفحص المربع يتناسب ديناميكيًا وحجمه ممتاز
          var minEdge = Math.min(viewfinderWidth, viewfinderHeight);
          var boxSize = Math.floor(minEdge * 0.75);
          if (boxSize < 200) boxSize = 200;
          return { width: boxSize, height: boxSize };
        },
        aspectRatio: 1.0 // إجبار الكاميرا على اتخاذ شكل مربع أو متناسق بدلاً من شريط
      };

      // تشغيل الكاميرا
      html5Qrcode
        .start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure)
        .then(function () {
          statusDiv.innerText = "📡 وجّه الكاميرا نحو الباركود...";
          // تحديث الارتفاع فورًا بعد تشغيل الكاميرا للتخلص من شكل الشريطة
          setTimeout(setFrameHeight, 300); 
        })
        .catch(function (err) {
          statusDiv.innerText = "⚠️ تعذّر تشغيل الكاميرا: " + err;
          setFrameHeight();
        });

      window.addEventListener("load", function () {
        notifyReady();
        setTimeout(setFrameHeight, 500);
      });
      notifyReady();
    </script>
  </body>
</html>
